[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flume-lib"
version = "0.9.0"
description = "Accélérateur d'ingestion API générique pour notebooks Fabric Python (non-Spark)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "deltalake>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.0"]
# Accès Key Vault hors Fabric (dans Fabric, notebookutils est préinstallé)
azure = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/flume_lib"]
