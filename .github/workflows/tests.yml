name: Tests

# Workflow réutilisable : la définition unique de « le code passe ».
#
# Appelé par CI sur chaque push et pull request, et par Release avant de
# construire quoi que ce soit. Deux copies de ces étapes finiraient par
# diverger, et c'est la copie de Release qui compte — celle qui garde une
# version cassée d'être publiée.

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref à tester. Vide = le commit déclencheur."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Versions des kernels Fabric Python notebook
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
