name: Tests

# Workflow réutilisable : la définition unique de « le code passe ».
#
# Appelé par CI sur chaque push et pull request, et par Release avant de
# construire quoi que ce soit. Deux copies de ces étapes finiraient par
# diverger, et c'est la copie de Release qui compte — celle qui garde une
# version cassée d'être publiée.

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref à tester. Vide = le commit déclencheur."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Versions des kernels Fabric Python notebook
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # `py.typed` est publié : les annotations sont une promesse faite aux
      # utilisateurs de la lib, pas un décor.
      - name: Types
        run: mypy

      # Sévérité moyenne et au-delà. Les constats de niveau « low » (un
      # `except: pass` assumé, une constante prise pour un mot de passe) sont du
      # bruit ici ; un constat plus grave doit s'expliquer ou se corriger.
      - name: Security lint
        run: bandit -r src -ll -q

      # Le seuil est dans pyproject.toml. `pytest` nu, pas `python -m pytest` :
      # ce dernier met le répertoire courant sur sys.path et masque les erreurs
      # d'import que la CI doit attraper.
      - name: Test
        run: pytest --cov

  # Chaque borne basse de pyproject.toml est une promesse : « ça marche avec
  # cette version ». Sans ce job, elle n'était jamais installée — la CI prenait
  # toujours la plus récente — et la promesse était fausse : avec arro3-core
  # 0.5, la lecture du watermark panique (`PanicException`) ; deltalake avant
  # 1.3.2 n'explique plus un `replace_where` refusé.
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install the lowest allowed version of each dependency
        run: |
          pip install uv==0.13.5 pytest
          # compilé à part, puis installé : `lowest-direct` appliqué à `.` ferait
          # aussi descendre hatchling, le backend de build, à une version qui
          # n'existe plus sous forme exploitable
          uv pip compile pyproject.toml --resolution lowest-direct \
            --python-version 3.10 --no-header --no-annotate -o minimum.txt
          cat minimum.txt
          pip install -r minimum.txt
          pip install --no-deps .

      - name: Test
        run: pytest

  # La suite tourne sous Windows : c'est le poste de développement, et c'est là
  # qu'un fichier écrit en CRLF ou un chemin à antislash a déjà posé problème.
  # Job à part, pour ne pas renommer les contrôles `test (3.x)` qu'une règle de
  # protection pourrait exiger.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest
