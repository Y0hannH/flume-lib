name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # L'installation recommandée est hors ligne : un lot déposé dans un lakehouse
  # fige ses versions et ne se met à jour que si quelqu'un en redépose un. Une
  # CVE publiée après la release ne se signalerait donc nulle part. Ce passage
  # hebdomadaire est le seul mécanisme qui la fasse remonter.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lint et suite sur les trois versions de kernel Fabric. Défini une seule
  # fois, dans tests.yml, parce que Release s'appuie sur la même définition.
  tests:
    uses: ./.github/workflows/tests.yml

  # Le tableau des SHA du README est ce qui rend l'install depuis GitHub
  # utilisable : une version absente n'est installable par personne. Il a été
  # oublié deux fois de suite, d'où ce contrôle plutôt qu'une ligne de plus
  # dans la procédure de release. Hors de tests.yml volontairement : Release
  # s'appuie sur ce workflow-là, et l'état du README n'est pas une propriété
  # du code qu'on publie.
  readme-shas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # l'historique complet et les tags : le contrôle les compare à HEAD
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: SHA table covers the published tags
        run: python scripts/check_readme_shas.py

  # L'index des clés du cookbook est généré depuis validation.py et depuis les
  # défauts lus dans l'implémentation. Personne ne pense à le regénérer en
  # ajoutant une clé, et un index de référence faux est pire que pas d'index :
  # on le consulte au lieu de lire la source, et on y croit. D'où ce contrôle
  # plutôt qu'une ligne de plus dans une procédure.
  key-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # le script résout les défauts nommés en important flume_lib.source,
      # qui tire requests et delta-rs : les dépendances runtime suffisent
      - name: Install the runtime dependencies
        run: pip install .

      - name: Key index matches the code
        run: python scripts/gen_key_index.py --check

  # requirements/runtime.txt fige les versions (et les hashes) de ce qui part chez
  # le client. Une dépendance changée dans pyproject.toml sans que le lockfile
  # suive donnerait un lot de wheels qui ne correspond plus à ce que le code
  # déclare. `uv pip compile` repart du fichier existant : il ne bouge que ce que
  # pyproject.toml impose, et la mise à jour d'une version est un geste explicite.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install uv==0.13.5

      - name: Lockfile matches pyproject.toml
        run: |
          uv pip compile pyproject.toml --universal --python-version 3.10 \
            --generate-hashes --no-header -o requirements/runtime.txt
          git diff --exit-code requirements/runtime.txt

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # sans [dev] : on audite ce qui part chez le client, pas l'outillage
      - name: Install the runtime dependencies
        run: pip install .

      - name: Known vulnerabilities (OSV.dev)
        run: python scripts/audit_dependencies.py

  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install build

      - name: Build the wheel
        run: python -m build --wheel

      # Le lot de wheels Fabric est installé hors ligne depuis le lakehouse :
      # un wheel qui ne porte pas py.typed ou qui oublie un module ne se voit
      # qu'au moment où le notebook l'importe.
      - name: Check the wheel contents
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("flume_lib-*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          modules = {p.name for p in pathlib.Path("src/flume_lib").glob("*.py")}
          missing = {m for m in modules if f"flume_lib/{m}" not in names}
          assert not missing, f"modules absents du wheel : {missing}"
          assert "flume_lib/py.typed" in names, "py.typed absent du wheel"
          print(f"{wheel.name} : {len(modules)} modules + py.typed")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel
          path: dist/*.whl
